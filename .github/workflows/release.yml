name: release

# Runs when a version tag (v1.2.3) is pushed, e.g. by `cog bump`.
# npm and the MCP Registry both accept this workflow's GitHub OIDC identity,
# so no tokens or passkeys are needed. One-time setup on npmjs.com:
# package `imap-wizard` > Settings > Trusted Publisher > GitHub Actions,
# repository Fe2-O3/imap-wizard, workflow `release.yml`.
#
# Every checkout names refs/tags/<tag>, so a manual run can only release an
# existing version tag, never a branch that happens to carry the same name.
# Third-party actions are pinned to commit hashes (the comment names the
# version; Dependabot updates both). ":latest" and the GitHub "latest" release
# move only when the tag is the newest version tag, so re-running an old tag
# never moves them backwards.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (e.g. v0.3.3)"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  verify:
    name: verify tag and test
    runs-on: ubuntu-latest
    outputs:
      newest: ${{ steps.newest.outputs.newest }}
    steps:
      - name: Tag is a release version
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Not a release tag: $TAG" >&2
            exit 1
          fi
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: refs/tags/${{ env.TAG }}
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: pnpm
      - name: Is this the newest version tag?
        id: newest
        run: |
          newest=$(git ls-remote --tags --refs origin 'v*.*.*' | sed 's|.*refs/tags/||' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
          if [ "$newest" = "$TAG" ]; then
            echo "newest=true" >> "$GITHUB_OUTPUT"
          else
            echo "newest=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Tag matches package.json and server.json
        run: |
          v="${TAG#v}"
          test "$(jq -r .version package.json)" = "$v"
          test "$(jq -r .version server.json)" = "$v"
          test "$(jq -r '.packages[0].version' server.json)" = "$v"
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test

  npm:
    name: publish to npm
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: refs/tags/${{ env.TAG }}
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Publish (skipped if this version is already on npm)
        run: |
          v="${TAG#v}"
          if npm view "imap-wizard@$v" version >/dev/null 2>&1; then
            echo "imap-wizard@$v is already published"
          else
            npm publish --provenance --access public
          fi

  registry:
    name: publish to MCP Registry
    needs: npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # registry login via GitHub OIDC
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: refs/tags/${{ env.TAG }}
      - name: Wait for npm to serve the new version
        run: |
          v="${TAG#v}"
          for _ in $(seq 1 30); do
            npm view "imap-wizard@$v" version >/dev/null 2>&1 && exit 0
            sleep 10
          done
          echo "imap-wizard@$v never appeared on npm" >&2
          exit 1
      - name: Install mcp-publisher
        run: |
          curl -fsSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.9/mcp-publisher_linux_amd64.tar.gz"
          # The digest GitHub lists for this v1.8.9 release asset.
          echo "4d527ca8f1ced0394c962dc925c2a4a4addef441cbefd62501c875e9481823a8  mcp-publisher.tar.gz" \
            | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
      - run: ./mcp-publisher validate
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish

  docker:
    name: publish Docker image
    # After npm: a failed npm publish must not leave an image out for a version that is not.
    needs: [verify, npm]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: refs/tags/${{ env.TAG }}
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/fe2-o3/imap-wizard:${{ env.TAG }}
            ${{ needs.verify.outputs.newest == 'true' && 'ghcr.io/fe2-o3/imap-wizard:latest' || '' }}
          labels: |
            org.opencontainers.image.version=${{ env.TAG }}
            org.opencontainers.image.revision=${{ github.sha }}

  github-release:
    name: GitHub release
    needs: [verify, npm, registry, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: refs/tags/${{ env.TAG }}
      - name: Notes from CHANGELOG
        run: |
          v="${TAG#v}"
          awk -v v="$v" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
          { echo; echo "Install: \`npx -y imap-wizard\`, or \`docker pull ghcr.io/fe2-o3/imap-wizard:$TAG\`"; } >> notes.md
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          NEWEST: ${{ needs.verify.outputs.newest }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" --title "$TAG" --notes-file notes.md --latest="$NEWEST"
          fi
