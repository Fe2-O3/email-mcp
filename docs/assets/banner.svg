<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="IMAP Wizard — hardened email MCP server: 49 tools, 428 tests green, 17 upstream bugs closed">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b0764"/>
      <stop offset="50%" stop-color="#5b21b6"/>
      <stop offset="100%" stop-color="#701a75"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <radialGradient id="glowGold" cx="12%" cy="25%" r="55%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPink" cx="88%" cy="85%" r="55%">
      <stop offset="0%" stop-color="#f472b6" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0"/>
    </radialGradient>
    <g id="sparkle">
      <path d="M0 -14 L3.5 -3.5 L14 0 L3.5 3.5 L0 14 L-3.5 3.5 L-14 0 L-3.5 -3.5 Z"/>
    </g>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="18" fill="url(#glowGold)"/>
  <rect width="1200" height="320" rx="18" fill="url(#glowPink)"/>
  <rect x="1" y="1" width="1198" height="318" rx="17" fill="none" stroke="#ffffff" stroke-opacity="0.22"/>
  <rect x="0" y="0" width="1200" height="5" rx="2.5" fill="url(#bar)"/>

  <!-- mark: envelope plus wand and sparkles -->
  <g transform="translate(70,96)">
    <rect x="0" y="8" width="116" height="82" rx="10" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-width="3"/>
    <path d="M8 22 L58 60 L108 22" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="84" y1="96" x2="140" y2="40" stroke="#fbbf24" stroke-width="7" stroke-linecap="round"/>
    <circle cx="143" cy="36" r="9" fill="#fbbf24" fill-opacity="0.35" stroke="#fbbf24" stroke-width="2"/>
    <use href="#sparkle" transform="translate(150,6) scale(0.62)" fill="#fde68a"/>
    <use href="#sparkle" transform="translate(128,-10) scale(0.4)" fill="#a5f3fc"/>
    <use href="#sparkle" transform="translate(172,26) scale(0.32)" fill="#f0abfc"/>
    <circle cx="10" cy="6" r="5" fill="#34d399"/>
  </g>

  <text x="252" y="140" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="66" font-weight="800" fill="#ffffff">IMAP <tspan fill="#fbbf24">Wizard</tspan></text>
  <text x="254" y="186" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="24" fill="#f5e9ff">Email MCP server for your AI assistant — hardened, no cloud in the middle.</text>

  <!-- stat chips -->
  <g font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="600">
    <rect x="254" y="220" width="160" height="44" rx="22" fill="#ffffff" fill-opacity="0.12" stroke="#fbbf24" stroke-width="2"/>
    <text x="334" y="249" text-anchor="middle" fill="#fde68a">49 tools</text>

    <rect x="430" y="220" width="205" height="44" rx="22" fill="#ffffff" fill-opacity="0.12" stroke="#22d3ee" stroke-width="2"/>
    <text x="532" y="249" text-anchor="middle" fill="#a5f3fc">428 tests green</text>

    <rect x="651" y="220" width="300" height="44" rx="22" fill="#ffffff" fill-opacity="0.12" stroke="#e879f9" stroke-width="2"/>
    <text x="801" y="249" text-anchor="middle" fill="#f5d0fe">17 upstream bugs closed</text>

    <rect x="967" y="220" width="175" height="44" rx="22" fill="#ffffff" fill-opacity="0.12" stroke="#34d399" stroke-width="2"/>
    <text x="1054" y="249" text-anchor="middle" fill="#bbf7d0">MCP SDK v2</text>
  </g>
</svg>
