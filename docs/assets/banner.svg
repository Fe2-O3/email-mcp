<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="IMAP Wizard — hardened email MCP server: 49 tools, 428 tests green, 17 upstream bugs closed">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="55%" stop-color="#101a33"/>
      <stop offset="100%" stop-color="#1a1040"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="wand" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="envelope" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <radialGradient id="glow1" cx="14%" cy="18%" r="62%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="86%" cy="86%" r="55%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
    </radialGradient>
    <g id="sparkle">
      <path d="M0 -14 L3.5 -3.5 L14 0 L3.5 3.5 L0 14 L-3.5 3.5 L-14 0 L-3.5 -3.5 Z"/>
    </g>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="18" fill="url(#glow1)"/>
  <rect width="1200" height="320" rx="18" fill="url(#glow2)"/>
  <rect x="1" y="1" width="1198" height="318" rx="17" fill="none" stroke="#334155" stroke-opacity="0.6"/>
  <rect x="0" y="0" width="1200" height="5" rx="2.5" fill="url(#accent)"/>

  <!-- mark: envelope plus wand stroke and sparkles -->
  <g transform="translate(70,96)">
    <rect x="0" y="8" width="116" height="82" rx="10" fill="#0f172a" stroke="url(#envelope)" stroke-width="3"/>
    <path d="M8 22 L58 60 L108 22" fill="none" stroke="url(#envelope)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="84" y1="96" x2="140" y2="40" stroke="url(#wand)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="143" cy="36" r="9" fill="#c084fc" fill-opacity="0.35" stroke="#c084fc" stroke-width="2"/>
    <use href="#sparkle" transform="translate(150,6) scale(0.62)" fill="#fbbf24"/>
    <use href="#sparkle" transform="translate(128,-10) scale(0.4)" fill="#38bdf8"/>
    <use href="#sparkle" transform="translate(172,26) scale(0.32)" fill="#34d399"/>
    <circle cx="10" cy="6" r="5" fill="#34d399"/>
  </g>

  <text x="252" y="140" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="66" font-weight="800" fill="#f8fafc">IMAP <tspan fill="url(#accent)">Wizard</tspan></text>
  <text x="254" y="186" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="25" fill="#94a3b8">Email MCP server for your AI assistant — local, hardened, no cloud in the middle.</text>

  <!-- stat chips -->
  <g font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="600">
    <rect x="254" y="220" width="150" height="44" rx="22" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <text x="329" y="249" text-anchor="middle" fill="#38bdf8">49 tools</text>

    <rect x="420" y="220" width="190" height="44" rx="22" fill="#0f172a" stroke="#818cf8" stroke-width="2"/>
    <text x="515" y="249" text-anchor="middle" fill="#a5b4fc">428 tests green</text>

    <rect x="626" y="220" width="230" height="44" rx="22" fill="#0f172a" stroke="#c084fc" stroke-width="2"/>
    <text x="741" y="249" text-anchor="middle" fill="#d8b4fe">17 upstream bugs closed</text>

    <rect x="872" y="220" width="200" height="44" rx="22" fill="#0f172a" stroke="#34d399" stroke-width="2"/>
    <text x="972" y="249" text-anchor="middle" fill="#6ee7b7">MCP SDK v2</text>
  </g>
</svg>
