<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Email MCP — hardened fork">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="55%" stop-color="#101a33"/>
      <stop offset="100%" stop-color="#1a1040"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="envelope" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <radialGradient id="glow1" cx="15%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="85%" cy="85%" r="55%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="18" fill="url(#glow1)"/>
  <rect width="1200" height="320" rx="18" fill="url(#glow2)"/>
  <rect x="1" y="1" width="1198" height="318" rx="17" fill="none" stroke="#334155" stroke-opacity="0.6"/>

  <!-- envelope mark -->
  <g transform="translate(78,110)">
    <rect x="0" y="0" width="112" height="80" rx="10" fill="#0f172a" stroke="url(#envelope)" stroke-width="3"/>
    <path d="M8 14 L56 52 L104 14" fill="none" stroke="url(#envelope)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="112" cy="8" r="7" fill="#34d399"/>
  </g>

  <text x="220" y="140" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="64" font-weight="800" fill="#f8fafc">Email <tspan fill="url(#accent)">MCP Server</tspan></text>
  <text x="222" y="188" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="26" fill="#94a3b8">The hardened fork of codefuturist/email-mcp — fixed, secured, released.</text>

  <!-- stat chips -->
  <g font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="600">
    <rect x="222" y="222" width="150" height="44" rx="22" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <text x="297" y="251" text-anchor="middle" fill="#38bdf8">49 tools</text>

    <rect x="388" y="222" width="190" height="44" rx="22" fill="#0f172a" stroke="#818cf8" stroke-width="2"/>
    <text x="483" y="251" text-anchor="middle" fill="#a5b4fc">428 tests green</text>

    <rect x="594" y="222" width="230" height="44" rx="22" fill="#0f172a" stroke="#c084fc" stroke-width="2"/>
    <text x="709" y="251" text-anchor="middle" fill="#d8b4fe">17 upstream bugs closed</text>

    <rect x="840" y="222" width="200" height="44" rx="22" fill="#0f172a" stroke="#34d399" stroke-width="2"/>
    <text x="940" y="251" text-anchor="middle" fill="#6ee7b7">MCP SDK v2</text>
  </g>
</svg>
