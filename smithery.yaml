# Smithery configuration — https://smithery.ai/docs/build
# Lists imap-wizard on the Smithery MCP marketplace.
# Config is stored locally via `imap-wizard account add`; no runtime secrets needed here.
startCommand:
  type: stdio
  configSchema:
    type: object
    properties: {}
    additionalProperties: false
  commandFunction: |-
    (config) => ({
      command: "npx",
      args: ["-y", "imap-wizard", "stdio"]
    })
