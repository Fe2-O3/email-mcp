# pnpm 11 settings (camelCase; the package.json "pnpm" field is no longer read).
# Dependencies allowed to run install/build scripts (supply-chain gate).
allowBuilds:
  cpu-features: true
  esbuild: true
  lefthook: true
  protobufjs: true
  ssh2: true
# Dev-only security floors for the vitest -> vite toolchain (never shipped to users).
overrides:
  vite: ^7.3.7
  postcss: ^8.5.23
  nanoid@<4: ^3.3.18
  rollup: ^4.59.0
  esbuild: ^0.28.1
  source-map-js: ^1.2.2
